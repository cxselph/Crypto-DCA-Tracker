# Dependabot proposes updates as PRs; nothing merges or installs on its own. Never auto-merge.
# A release has to be public for 14 days before it's proposed; security fixes skip that wait.
# The app has no Python packages (standard library only), so this covers the pinned base image
# (app/Dockerfile, by digest) and the CI actions (by commit SHA).
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
